name: Release

# A tag v<version> (the version in VERSION) builds the Windows driver
# package and checksums it; ./release.sh <tag> then publishes it.
# BananaSplit's "Splitter download page" button opens this repository's
# releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Splitter for Windows
    runs-on: windows-2025-vs2026
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The commit that was built, for the name of the release files:
      # release.sh takes only files built from the commit the tag points to.
      - name: Built commit
        id: commit
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Check tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne $env:TAG) {
            Write-Output "::error::Tag $env:TAG does not match VERSION $version (v$version)"
            exit 1
          }

      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build, check, test-sign and package
        shell: pwsh
        run: |
          try {
            ./windows/build.ps1
          } catch {
            Write-Output "::error::Splitter build: $($_.Exception.Message)"
            throw
          }

      - uses: actions/upload-artifact@v7
        with:
          name: splitter-release-windows
          path: windows/dist/*.zip
          if-no-files-found: error

  # The workflow doesn't publish the release: ./release.sh <tag> takes these
  # files and makes the release under the maintainer's own GitHub account.
  files:
    name: Release files
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: splitter-release-windows
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: splitter-${{ env.TAG }}-${{ needs.windows.outputs.commit }}
          path: dist/*
          if-no-files-found: error
