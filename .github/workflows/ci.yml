name: CI

# Every push to main and every pull request: the cable rules and the INF
# check on Linux, and the real driver build (MSVC, InfVerif, test signing)
# on Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Cable rules and INF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Ring and format tests
        working-directory: windows
        shell: bash
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/cablerule_test" tests/cablerule_test.cpp
          "$RUNNER_TEMP/cablerule_test" | tee "$RUNNER_TEMP/cablerule.log" || {
            grep '^FAIL' "$RUNNER_TEMP/cablerule.log" | head -n 20 | sed 's/^/::error::/'
            exit 1
          }

      - name: INF and C++ tables agree
        run: python3 windows/tests/inf_check.py

  windows:
    name: Windows driver
    # The image Microsoft's Windows-driver-samples CI builds with.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build, check, test-sign and package
        shell: pwsh
        run: |
          try {
            ./windows/build.ps1
          } catch {
            Write-Output "::error::Splitter build: $($_.Exception.Message)"
            throw
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: splitter-windows-x64
          path: windows/dist/*.zip
          if-no-files-found: error
          retention-days: 14
